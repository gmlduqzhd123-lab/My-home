<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14233B" />
    <meta name="description" content="순천의 모든 집, 모든 가격, 모든 변화를 한눈에. 국토교통부 실거래가 공개 자료 기반 순천시 아파트 정보 서비스." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>순천집 ZIP — 순천 부동산의 모든 것</title>
    <script>
      // 첫 페인트 전에 테마 적용(깜빡임 방지)
      try {
        var t = JSON.parse(localStorage.getItem('suncheon-zip:prefs') || '{}').state?.theme
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
