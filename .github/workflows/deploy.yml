name: 데이터 수집 · 배포

on:
  schedule:
    # 매일 07:30 KST (22:30 UTC). GitHub 예약 실행은 지연될 수 있어 08:00 이전 완료를 목표로 30분 앞당겼다.
    # 실제 완료 시각은 manifest.json 의 generatedAt 으로 화면에 표시된다.
    - cron: '30 22 * * *'
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      months:
        description: '재조회할 개월 수(비우면 첫 실행 24, 이후 12). 과거 기간을 늘리려면 60 등으로 지정'
        required: false
        default: ''
      skip_collect:
        description: '수집 없이 빌드·배포만'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      collect: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 수집기 테스트
        run: npm run test:py

      # 수집 실패 시에도 마지막 정상 데이터로 배포를 계속한다(실패 사실은 manifest 와 화면에 표시).
      - name: 공공데이터 수집
        id: collect
        if: github.event_name != 'push' && inputs.skip_collect != true
        continue-on-error: true
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          RENT_API_KEY: ${{ secrets.RENT_API_KEY }}
          KAPT_API_KEY: ${{ secrets.KAPT_API_KEY }}
          APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
          SCHOOL_API_KEY: ${{ secrets.SCHOOL_API_KEY }}
          LH_API_KEY: ${{ secrets.LH_API_KEY }}
          BUILDING_HUB_API_KEY: ${{ secrets.BUILDING_HUB_API_KEY }}
          BUILDING_REGISTER_API_KEY: ${{ secrets.BUILDING_REGISTER_API_KEY }}
          MOLIT_STAT_API_KEY: ${{ secrets.MOLIT_STAT_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          MONTHS: ${{ inputs.months }}
        run: |
          if [ -n "$MONTHS" ]; then python scripts/collect.py --months "$MONTHS"; else python scripts/collect.py; fi

      - name: 수집 결과 커밋
        if: github.event_name != 'push' && inputs.skip_collect != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data-cache
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 수집"
            git push
          fi

      # 새 청약 공고가 수집되면 이슈를 만든다 → 저장소를 Watch 한 사람에게 GitHub 가 메일을 보낸다.
      - name: 새 청약 공고 알림(이슈)
        if: github.event_name != 'push' && inputs.skip_collect != true && steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          python scripts/notify_new.py public/data/alerts.json "$site" > /tmp/notice.md
          if [ -s /tmp/notice.md ]; then
            head -n 1 /tmp/notice.md > /tmp/title.txt
            tail -n +2 /tmp/notice.md > /tmp/body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat /tmp/title.txt)" --body-file /tmp/body.md
          else
            echo "새 청약 공고 없음"
          fi

      - name: 타입 검사 · 린트 · 테스트
        run: |
          npm run typecheck
          npm run lint
          npm run test

      # 지도는 OpenStreetMap(키 불필요)이라 빌드에 넣을 키가 없다
      - name: 빌드
        run: npm run build

      - name: 배포 경로 · API 키 노출 점검
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          RENT_API_KEY: ${{ secrets.RENT_API_KEY }}
          KAPT_API_KEY: ${{ secrets.KAPT_API_KEY }}
          APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
          SCHOOL_API_KEY: ${{ secrets.SCHOOL_API_KEY }}
          LH_API_KEY: ${{ secrets.LH_API_KEY }}
          BUILDING_HUB_API_KEY: ${{ secrets.BUILDING_HUB_API_KEY }}
          BUILDING_REGISTER_API_KEY: ${{ secrets.BUILDING_REGISTER_API_KEY }}
          MOLIT_STAT_API_KEY: ${{ secrets.MOLIT_STAT_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: |
          npm run check:pages
          npm run check:secrets

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  collect-status:
    # 배포는 끝내되, 수집이 실패한 날은 이슈로 알리고 실행 결과를 실패로 남긴다.
    needs: [build, deploy]
    if: always() && needs.build.outputs.collect == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: 수집 실패 알림(이슈)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="공공데이터 수집 실패"
          body="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 수집에 실패했습니다. 사이트는 마지막 정상 데이터로 배포되었습니다.

          실행 기록: $RUN_URL

          인증키 만료, 활용신청 상태, 공공데이터포털 장애 여부를 확인해 주세요. 다음 수집이 성공하면 이 이슈를 닫아도 됩니다."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
      - run: |
          echo "::error::공공데이터 수집에 실패했습니다. 사이트는 마지막 정상 데이터로 배포되었습니다."
          exit 1
